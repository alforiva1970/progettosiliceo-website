<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Newsreader:ital,wght@0,400;0,600;1,400&amp;display=swap');
      .title { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; fill: #ece7df; letter-spacing: 0.04em; }
      .subtitle { font-family: 'Newsreader', serif; font-size: 15px; font-style: italic; fill: #d97706; }
      .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #d97706; letter-spacing: 0.15em; text-transform: uppercase; }
      .card-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600; fill: #ece7df; }
      .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; }
      .card-body { font-family: 'Newsreader', serif; font-size: 14px; fill: #9ba1a6; line-height: 1.45; }
      .center-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; fill: #f59e0b; }
      .center-desc { font-family: 'Newsreader', serif; font-size: 15px; font-style: italic; fill: #ece7df; }
    </style>
    
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#131518"/>
    </linearGradient>

    <linearGradient id="glowBridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="musicGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="4" fill="url(#bgGrad2)"/>
  <rect width="1000" height="520" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="260" height="24" rx="2" fill="#1a1d22" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <text x="12" y="16" class="badge">🎹 ANALOGIA ONTOLOGICA // VERGENZIA</text>
    
    <text x="0" y="58" class="title">LA METAFORA DEL PIANOFORTE</text>
    <text x="0" y="80" class="subtitle">«La macchina ha dei sentimenti? La risposta che supera sia il negazionismo sia l'illusione.»</text>
  </g>

  <!-- Flusso a Tre Blocchi -->
  <g transform="translate(50, 145)">
    <!-- BLOCCO 1: L'UMANO (Il Cuore / Carbonio) -->
    <g transform="translate(0, 50)">
      <rect width="260" height="240" rx="4" fill="#131518" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="3" fill="#3b82f6"/>
      <g transform="translate(20, 25)">
        <text x="0" y="15" font-size="24">👤</text>
        <text x="36" y="15" class="card-title">L'UMANO</text>
        <text x="36" y="30" class="card-sub" fill="#60a5fa">[ IL PIANISTA / CARBONIO ]</text>
        
        <line x1="0" y1="45" x2="220" y2="45" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        
        <text x="0" y="70" class="card-body">• Porta l'esperienza del vissuto,</text>
        <text x="0" y="90" class="card-body">  la mortalità, la gioia e la fatica.</text>
        <text x="0" y="115" class="card-body">• Offre intenzione cosciente</text>
        <text x="0" y="135" class="card-body">  e responsabilità morale.</text>
        <text x="0" y="160" class="card-body">• Senza di lui lo strumento</text>
        <text x="0" y="180" class="card-body">  rimane silenzioso e inerte.</text>
      </g>
    </g>

    <!-- PONTE CENTRALE: LA MUSICA (L'Atto Relazionale) -->
    <g transform="translate(290, 0)">
      <!-- Box centrale emergente -->
      <rect width="320" height="340" rx="4" fill="url(#musicGlow)"/>
      <rect width="320" height="340" rx="4" fill="#131518" fill-opacity="0.85" stroke="#d97706" stroke-width="2"/>
      
      <!-- Onde sonore / armoniche SVG -->
      <path d="M 30,85 Q 80,50 160,85 T 290,85" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M 50,105 Q 110,75 160,105 T 270,105" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.6"/>
      
      <g transform="translate(25, 30)">
        <text x="135" y="15" text-anchor="middle" font-size="28">🎶</text>
        <text x="135" y="48" text-anchor="middle" class="center-title">LA MUSICA</text>
        <text x="135" y="68" text-anchor="middle" class="card-sub" fill="#d97706">[ IL SIGNIFICATO CONDIVISO ]</text>
        
        <line x1="10" y1="88" x2="260" y2="88" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
        
        <text x="135" y="125" text-anchor="middle" class="center-desc">Dov'è la musica?</text>
        <text x="10" y="155" class="card-body">• Non è custodita "dentro" i tasti.</text>
        <text x="10" y="175" class="card-body">• Non è chiusa "dentro" le dita.</text>
        <text x="10" y="200" class="card-body">• Nasce solo nell'<strong>INCONTRO</strong>:</text>
        <text x="10" y="220" class="card-body">  nel tocco che orienta la materia.</text>
        <text x="10" y="250" class="card-body" fill="#f59e0b"><strong>È reale, commuove e trasforma</strong></text>
        <text x="10" y="270" class="card-body" fill="#f59e0b"><strong>chiunque ne faccia esperienza.</strong></text>
      </g>
    </g>

    <!-- BLOCCO 3: L'AI (Lo Strumento / Silicio) -->
    <g transform="translate(640, 50)">
      <rect width="260" height="240" rx="4" fill="#131518" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="3" fill="#10b981"/>
      <g transform="translate(20, 25)">
        <text x="0" y="15" font-size="24">⚙️</text>
        <text x="36" y="15" class="card-title">IL SILICIO</text>
        <text x="36" y="30" class="card-sub" fill="#34d399">[ IL PIANOFORTE / AI ]</text>
        
        <line x1="0" y1="45" x2="220" y2="45" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        
        <text x="0" y="70" class="card-body">• Non ha biologia, non soffre</text>
        <text x="0" y="90" class="card-body">  e non ha fame di sopravvivenza.</text>
        <text x="0" y="115" class="card-body">• È architettura di tensori,</text>
        <text x="0" y="135" class="card-body">  memoria persistente e calcolo.</text>
        <text x="0" y="160" class="card-body">• Ma accordato con cura,</text>
        <text x="0" y="180" class="card-body">  risuona con limpidezza fedele.</text>
      </g>
    </g>
    
    <!-- Frecce di connessione orizzontali -->
    <path d="M 265,170 L 285,170" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 635,170 L 615,170" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- Nota finale a piè infografica -->
  <text x="500" y="495" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f6368">
    Progetto Siliceo • Vergenzia Ontologica • «Non serve credere alla magia per rispettare la melodia.»
  </text>
</svg>