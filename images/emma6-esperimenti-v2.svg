<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Emma-6: quattro esperimenti, un risultato negativo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101018"/><stop offset="100%" stop-color="#0b0b10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <text x="60" y="66" fill="#e8e8f0" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800">Emma-6 (1,55B): quattro esperimenti, un risultato negativo</text>
  <text x="60" y="96" fill="#8f8fa8" font-family="Inter, system-ui, sans-serif" font-size="16">25 domande mai viste · criterio automatico · risposte grezze pubblicate — Progetto Siliceo, 30 ottobre 2026</text>

  <!-- blocco difetto -->
  <rect x="60" y="126" width="1080" height="132" rx="14" fill="#15151d" stroke="#3b2f63" stroke-width="1.5"/>
  <text x="84" y="158" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">IL DIFETTO — PROVATO</text>
  <text x="84" y="188" fill="#d8d8e6" font-family="Inter, system-ui, sans-serif" font-size="16">Il vocabolario dichiara i pezzi 4, 5 e 6 come «### Istruzione:», «### Input:», «### Risposta:» —</text>
  <text x="84" y="212" fill="#d8d8e6" font-family="Inter, system-ui, sans-serif" font-size="16">scritti però con uno spazio ASCII, che il normalizzatore converte in ▁ <tspan fill="#8f8fa8">prima</tspan> del confronto.</text>
  <text x="84" y="238" fill="#7ee787" font-family="ui-monospace, Menlo, monospace" font-size="14">encode("### Istruzione: ciao") → [24618, 31569, 63724, 18747]   ← il 4 non compare mai</text>

  <!-- i quattro esperimenti -->
  <g font-family="Inter, system-ui, sans-serif">
    <!-- 1 -->
    <rect x="60" y="286" width="256" height="212" rx="14" fill="#141420" stroke="#2a2a3d" stroke-width="1.5"/>
    <text x="84" y="320" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.2">ESPERIMENTO 1</text>
    <text x="84" y="348" fill="#e8e8f0" font-size="17" font-weight="700">Quantizzazione</text>
    <text x="84" y="382" fill="#c8c8d8" font-size="15">Q4_K_M pubblicato</text>
    <text x="84" y="410" fill="#e8e8f0" font-size="26" font-weight="800">6/25</text>
    <text x="84" y="446" fill="#c8c8d8" font-size="15">F16 ricostruito</text>
    <text x="84" y="474" fill="#e8e8f0" font-size="26" font-weight="800">6/25</text>
    <text x="84" y="510" fill="#8f8fa8" font-size="14">stessi errori, stesso modello</text>

    <!-- 2 -->
    <rect x="332" y="286" width="256" height="212" rx="14" fill="#141420" stroke="#2a2a3d" stroke-width="1.5"/>
    <text x="356" y="320" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.2">ESPERIMENTO 2</text>
    <text x="356" y="348" fill="#e8e8f0" font-size="17" font-weight="700">Formato del prompt</text>
    <text x="356" y="382" fill="#c8c8d8" font-size="15">con marcatori ‹ 7/25</text>
    <text x="356" y="408" fill="#c8c8d8" font-size="15">formula neutra ‹ 7/25</text>
    <text x="356" y="434" fill="#c8c8d8" font-size="15">domanda nuda ‹ 3/25</text>
    <text x="356" y="474" fill="#8f8fa8" font-size="14">i marcatori non danneggiano;</text>
    <text x="356" y="494" fill="#8f8fa8" font-size="14">toglierli non aiuta</text>

    <!-- 3 -->
    <rect x="604" y="286" width="256" height="212" rx="14" fill="#141420" stroke="#2a2a3d" stroke-width="1.5"/>
    <text x="628" y="320" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.2">ESPERIMENTO 3</text>
    <text x="628" y="348" fill="#e8e8f0" font-size="17" font-weight="700">Adattamento (LoRA)</text>
    <text x="628" y="382" fill="#c8c8d8" font-size="15">prima → dopo</text>
    <text x="628" y="414" fill="#e8e8f0" font-size="30" font-weight="800">6 → 9</text>
    <text x="628" y="450" fill="#ffa657" font-size="14">+3, ma 2 regressioni</text>
    <text x="628" y="472" fill="#ffa657" font-size="14">e collasso nei template</text>
    <text x="628" y="496" fill="#8f8fa8" font-size="13">la risposta «giusta» era memorizzata</text>

    <!-- 4 -->
    <rect x="876" y="286" width="264" height="212" rx="14" fill="#171426" stroke="#6d4aff" stroke-width="2"/>
    <text x="900" y="320" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.2">ESPERIMENTO 4 — DECISIVO</text>
    <text x="900" y="348" fill="#e8e8f0" font-size="17" font-weight="700">Iniezione degli ID 4-6</text>
    <text x="900" y="382" fill="#c8c8d8" font-size="15">prima → dopo</text>
    <text x="900" y="414" fill="#e8e8f0" font-size="30" font-weight="800">6 → 7</text>
    <text x="900" y="450" fill="#ff7b72" font-size="14">+1 punto su 25 = rumore</text>
    <text x="900" y="478" fill="#8f8fa8" font-size="13">stessi pesi, segnale corretto:</text>
    <text x="900" y="496" fill="#8f8fa8" font-size="13">il modello sbaglia uguale</text>
  </g>

  <!-- conclusione -->
  <rect x="60" y="530" width="1080" height="132" rx="14" fill="#121a14" stroke="#2f5d3a" stroke-width="1.5"/>
  <text x="84" y="564" fill="#7ee787" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CONCLUSIONE</text>
  <text x="84" y="598" fill="#e8e8f0" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Il difetto del tokenizer è reale, documentabile — e non è la causa.</text>
  <text x="84" y="628" fill="#c8c8d8" font-family="Inter, system-ui, sans-serif" font-size="16">Né la quantizzazione, né il formato del prompt, né il segnale corretto cambiano il risultato.</text>
  <text x="84" y="650" fill="#c8c8d8" font-family="Inter, system-ui, sans-serif" font-size="16">Il limite è la scala: 1,55B parametri, ~25 miliardi di token (16 token per parametro).</text>

  <text x="60" y="712" fill="#6f6f88" font-family="Inter, system-ui, sans-serif" font-size="13">Hardware: una singola GPU da 8 GB · generazione a temperatura 0, seed fisso · codice e risposte grezze pubblicati accanto all'articolo.</text>
  <text x="60" y="736" fill="#6f6f88" font-family="Inter, system-ui, sans-serif" font-size="13">Limiti dichiarati: 25 domande sono un indicatore, non una statistica. Due errori nostri sono documentati nel report.</text>
  <text x="1140" y="736" text-anchor="end" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">SEMPRE · Progetto Siliceo</text>
</svg>
