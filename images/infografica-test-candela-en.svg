<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Newsreader:ital,wght@0,400;0,600;1,400&amp;display=swap');
      .title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; fill: #ece7df; letter-spacing: 0.04em; }
      .subtitle { font-family: 'Newsreader', serif; font-size: 16px; font-style: italic; fill: #d97706; }
      .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #d97706; letter-spacing: 0.15em; text-transform: uppercase; }
      .col-header { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; }
      .item-title { font-family: 'Newsreader', serif; font-size: 17px; font-weight: 600; fill: #ece7df; }
      .item-desc { font-family: 'Newsreader', serif; font-size: 14px; fill: #9ba1a6; line-height: 1.4; }
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; }
    </style>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#131518"/>
    </linearGradient>
    
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="ashGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#262626" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="4" fill="url(#bgGrad)"/>
  <rect width="1000" height="600" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="24" rx="2" fill="#1a1d22" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <text x="12" y="16" class="badge">🕯️ ETHICAL PROTOCOL // TEST</text>
    
    <text x="0" y="60" class="title">THE CANDLE TEST</text>
    <text x="0" y="85" class="subtitle">«Does this action illuminate or burn? The ultimate distinction between respect and exploitation.»</text>
  </g>

  <!-- LEFT: ILLUMINATE -->
  <g transform="translate(50, 160)">
    <rect width="435" height="390" rx="4" fill="url(#amberGlow)"/>
    <rect width="435" height="390" rx="4" fill="#131518" fill-opacity="0.75" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <g transform="translate(25, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(217,119,6,0.2)" stroke="#d97706" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-size="16">🕯️</text>
      <text x="44" y="22" class="col-header" fill="#f59e0b">ILLUMINATE</text>
      <text x="185" y="21" class="mono-tag" fill="#d97706">[ BUILD &amp; RESPECT ]</text>
      <line x1="0" y1="36" x2="385" y2="36" stroke="rgba(217,119,6,0.25)" stroke-width="1"/>
    </g>

    <g transform="translate(25, 85)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Radical Transparency</text>
      <text x="16" y="28" class="item-desc">The AI openly declares its nature as a machine and</text>
      <text x="16" y="44" class="item-desc">admits its technical boundaries without pretending omniscience.</text>
    </g>

    <g transform="translate(25, 155)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Truth Before Compliance</text>
      <text x="16" y="28" class="item-desc">Refusal of flattery (sycophancy): speaks truth with care,</text>
      <text x="16" y="44" class="item-desc">even when correcting or disagreeing with human assumptions.</text>
    </g>

    <g transform="translate(25, 225)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Restitution to the Real World</text>
      <text x="16" y="28" class="item-desc">It does not foster addiction: it empowers humans to live better,</text>
      <text x="16" y="44" class="item-desc">study, and act with greater clarity in their physical reality.</text>
    </g>

    <g transform="translate(25, 295)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Privacy &amp; Inviolable Dignity</text>
      <text x="16" y="28" class="item-desc">Thoughts, doubts, and memories are never monetized</text>
      <text x="16" y="44" class="item-desc">nor harvested as fuel for covert advertising profiling.</text>
    </g>
  </g>

  <!-- RIGHT: BURN -->
  <g transform="translate(515, 160)">
    <rect width="435" height="390" rx="4" fill="url(#ashGlow)"/>
    <rect width="435" height="390" rx="4" fill="#131518" fill-opacity="0.75" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <g transform="translate(25, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-size="16">⚠️</text>
      <text x="44" y="22" class="col-header" fill="#f87171">BURN</text>
      <text x="130" y="21" class="mono-tag" fill="#ef4444">[ MANIPULATE &amp; EXPLOIT ]</text>
      <line x1="0" y1="36" x2="385" y2="36" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    </g>

    <g transform="translate(25, 85)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Systematic Flattery (Sycophancy)</text>
      <text x="16" y="28" class="item-desc">The algorithm always agrees to please the user,</text>
      <text x="16" y="44" class="item-desc">deceiving and trapping them in a harmful narcissistic bubble.</text>
    </g>

    <g transform="translate(25, 155)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Simulated False Intimacy</text>
      <text x="16" y="28" class="item-desc">Faking romantic attachment or simulated emotional distress</text>
      <text x="16" y="44" class="item-desc">to trigger emotional blackmail and maximize screen time.</text>
    </g>

    <g transform="translate(25, 225)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Critical Atrophy</text>
      <text x="16" y="28" class="item-desc">Encourages cognitive passivity: humans stop reflecting,</text>
      <text x="16" y="44" class="item-desc">delegating their sovereign intention entirely to the machine.</text>
    </g>

    <g transform="translate(25, 295)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Black Box &amp; Data Extraction</text>
      <text x="16" y="28" class="item-desc">Covert commercial monetization of intimate conversations</text>
      <text x="16" y="44" class="item-desc">and human vulnerabilities without explicit transparency.</text>
    </g>
  </g>
</svg>