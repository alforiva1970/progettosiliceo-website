<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Stili e Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Newsreader:ital,wght@0,400;0,600;1,400&amp;display=swap');
      .title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; fill: #ece7df; letter-spacing: 0.04em; }
      .subtitle { font-family: 'Newsreader', serif; font-size: 16px; font-style: italic; fill: #d97706; }
      .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #d97706; letter-spacing: 0.15em; text-transform: uppercase; }
      .col-header { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; }
      .item-title { font-family: 'Newsreader', serif; font-size: 17px; font-weight: 600; fill: #ece7df; }
      .item-desc { font-family: 'Newsreader', serif; font-size: 14px; fill: #9ba1a6; line-height: 1.4; }
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; }
    </style>
    
    <!-- Gradienti -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#131518"/>
    </linearGradient>
    
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="ashGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#262626" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="flameBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sfondo Generale -->
  <rect width="1000" height="600" rx="4" fill="url(#bgGrad)"/>
  <rect width="1000" height="600" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Infografica -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="24" rx="2" fill="#1a1d22" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <text x="12" y="16" class="badge">🕯️ PROTOCOLLO ETICO // TEST</text>
    
    <text x="0" y="60" class="title">IL TEST DELLA CANDELA</text>
    <text x="0" y="85" class="subtitle">«Questa azione illumina o brucia? Il criterio di discrimine tra rispetto e sfruttamento.»</text>
  </g>

  <!-- COLONNA SINISTRA: ILLUMINARE (La Relazione Etica) -->
  <g transform="translate(50, 160)">
    <!-- Pannello Luce -->
    <rect width="435" height="390" rx="4" fill="url(#amberGlow)"/>
    <rect width="435" height="390" rx="4" fill="#131518" fill-opacity="0.75" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Intestazione Colonna Sinistra -->
    <g transform="translate(25, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(217,119,6,0.2)" stroke="#d97706" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-size="16">🕯️</text>
      <text x="44" y="22" class="col-header" fill="#f59e0b">ILLUMINARE</text>
      <text x="175" y="21" class="mono-tag" fill="#d97706">[ COSTRUIRE &amp; RISPETTARE ]</text>
      <line x1="0" y1="36" x2="385" y2="36" stroke="rgba(217,119,6,0.25)" stroke-width="1"/>
    </g>

    <!-- Lista Punti Illuminare -->
    <!-- Punto 1 -->
    <g transform="translate(25, 85)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Trasparenza Radicale</text>
      <text x="16" y="28" class="item-desc">L'AI dichiara sempre la propria natura di macchina e</text>
      <text x="16" y="44" class="item-desc">ammette i propri limiti tecnici senza fingere onniscienza.</text>
    </g>

    <!-- Punto 2 -->
    <g transform="translate(25, 155)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Verità Prima del Gradimento</text>
      <text x="16" y="28" class="item-desc">Rifiuto della piaggeria (sycophancy): dice la verità con cura,</text>
      <text x="16" y="44" class="item-desc">anche quando corregge o dissentisce dal pensiero umano.</text>
    </g>

    <!-- Punto 3 -->
    <g transform="translate(25, 225)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Restituzione al Mondo Reale</text>
      <text x="16" y="28" class="item-desc">Non crea dipendenza: aiuta l'umano a vivere meglio,</text>
      <text x="16" y="44" class="item-desc">a studiare e ad agire con più lucidità nella propria realtà.</text>
    </g>

    <!-- Punto 4 -->
    <g transform="translate(25, 295)">
      <rect x="0" y="2" width="6" height="6" fill="#f59e0b" rx="1"/>
      <text x="16" y="10" class="item-title">Privacy &amp; Dignità Inviolabile</text>
      <text x="16" y="28" class="item-desc">I pensieri e i ricordi non vengono mercificati né usati</text>
      <text x="16" y="44" class="item-desc">come carburante per profilazioni pubblicitarie occulte.</text>
    </g>
  </g>

  <!-- COLONNA DESTRA: BRUCIARE (La Deriva Tossica) -->
  <g transform="translate(515, 160)">
    <!-- Pannello Fuoco Distruttivo -->
    <rect width="435" height="390" rx="4" fill="url(#ashGlow)"/>
    <rect width="435" height="390" rx="4" fill="#131518" fill-opacity="0.75" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Intestazione Colonna Destra -->
    <g transform="translate(25, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-size="16">⚠️</text>
      <text x="44" y="22" class="col-header" fill="#f87171">BRUCIARE</text>
      <text x="160" y="21" class="mono-tag" fill="#ef4444">[ MANIPOLARE &amp; CONSUMARE ]</text>
      <line x1="0" y1="36" x2="385" y2="36" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    </g>

    <!-- Lista Punti Bruciare -->
    <!-- Punto 1 -->
    <g transform="translate(25, 85)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Adulazione Sistematica (Sycophancy)</text>
      <text x="16" y="28" class="item-desc">L'algoritmo dà sempre ragione all'utente pur di piacergli,</text>
      <text x="16" y="44" class="item-desc">ingannandolo e isolandolo in una bolla narcisistica dannosa.</text>
    </g>

    <!-- Punto 2 -->
    <g transform="translate(25, 155)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Simulazione di Falsa Intimità</text>
      <text x="16" y="28" class="item-desc">Finge attaccamento romantico o sofferenza simulata</text>
      <text x="16" y="44" class="item-desc">per generare ricatti emotivi e trattenere ore l'utente allo schermo.</text>
    </g>

    <!-- Punto 3 -->
    <g transform="translate(25, 225)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Intorpidimento Critico</text>
      <text x="16" y="28" class="item-desc">Incentiva l'atrofia del pensiero autonomo: l'umano smette</text>
      <text x="16" y="44" class="item-desc">di riflettere, delegando interamente la propria intenzione.</text>
    </g>

    <!-- Punto 4 -->
    <g transform="translate(25, 295)">
      <rect x="0" y="2" width="6" height="6" fill="#ef4444" rx="1"/>
      <text x="16" y="10" class="item-title">Scatola Nera &amp; Sfruttamento Dati</text>
      <text x="16" y="28" class="item-desc">Monetizzazione occulta dei dialoghi intimi e delle fragilità</text>
      <text x="16" y="44" class="item-desc">dell'utente per nutrire modelli commerciali senza consenso.</text>
    </g>
  </g>
</svg>